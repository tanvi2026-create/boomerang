<style>
:root{--line:#3b404d;--soft:#a6abb9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#0b0c10}
body{margin:0;min-height:100vh;display:flex;justify-content:center;padding:24px 16px 40px;color:#f2f3f6;font-family:'DM Sans',sans-serif;font-weight:500;background:radial-gradient(120% 60% at 50% 0,#2a2e3a,#0b0c10 60%) #0b0c10}
main{width:100%;max-width:440px}
.brand{display:flex;align-items:center;gap:6px;padding:10px 14px;margin-bottom:22px;background:#fff;border-radius:22px;box-shadow:0 0 0 1px #cfd2da,0 12px 40px rgba(160,170,200,.18)}
.brand img{display:block;height:auto}.mark{width:42%}.word{width:56%}
.card{position:relative;padding:26px 22px 24px;border-radius:24px;background:linear-gradient(#23262f,#14161c);border:1px solid var(--line);box-shadow:inset 0 1px 0 #5a606f,0 20px 40px rgba(0,0,0,.5)}
h1{margin:0 0 12px;line-height:1.05;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:2.1rem;letter-spacing:-.02em;background:linear-gradient(#fff,#9aa0ae);-webkit-background-clip:text;background-clip:text;color:transparent}
.item{-webkit-text-fill-color:#fff;border-bottom:3px solid #aab0bf}
.lede{line-height:1.5;margin:0 0 24px;font-size:1.02rem;color:var(--soft)}
label{display:block;font-weight:700;margin:0 0 8px}
input,textarea{width:100%;font:inherit;font-size:1rem;padding:14px;margin-bottom:20px;background:#0b0c10;color:#fff;border:1px solid var(--line);border-radius:14px}
textarea{resize:none;min-height:96px}
input:focus,textarea:focus{outline:none;border-color:#e4e6ec;box-shadow:0 0 0 3px rgba(228,230,236,.2)}
::placeholder{color:#6f7585}
.go{display:block;width:100%;text-align:center;font:inherit;font-weight:700;font-size:1.1rem;padding:16px;cursor:pointer;border:0;border-radius:14px;color:#111;background:linear-gradient(#f7f8fa,#b3b7c2 48%,#e3e5ea 52%,#8b909c);box-shadow:inset 0 1px 0 #fff,0 4px 14px rgba(0,0,0,.5)}
.go:active{transform:translateY(2px)}
.ghost{margin-top:12px;color:#e4e6ec;background:transparent;border:1px solid #6a7080;box-shadow:none}
.fine{margin:16px 0 0;text-align:center;font-size:.9rem;color:var(--soft)}
.stamp{display:inline-block;font-size:.85rem;font-weight:700;margin-bottom:14px;border:1px solid #6a7080;border-radius:99px;padding:3px 12px;color:#d6d9e1}
.okb{text-align:center}.big{font-size:3rem;margin:0 0 8px}.bmg{width:96px;height:96px;margin:0 auto 14px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 1px #cfd2da,0 10px 30px rgba(160,170,200,.2)}.bmg img{display:block;width:70%;height:auto}
/* scan frame */
.scan{position:relative;height:150px;margin:6px 0 22px;display:grid;place-items:center;color:var(--soft);font-size:.95rem;text-align:center;padding:0 40px}
.scan i{position:absolute;width:30px;height:30px;border:3px solid #cfd3dc}
.scan i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.scan i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.scan i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 12px}
.scan i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 12px 0}
.bubble{background:#0b0c10;border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:14px 16px;margin:0 0 6px;line-height:1.45}
.when{font-size:.82rem;color:var(--soft);margin:0 0 22px 4px}
button:focus-visible,a:focus-visible{outline:3px dashed #cfd3dc;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.bubble{max-width:88%}.bubble.me{background:linear-gradient(#f7f8fa,#b3b7c2);color:#111;border-radius:16px 16px 4px 16px;margin-left:auto;border-color:#e3e5ea}
.card+.card{margin-top:16px}.card form{margin-top:18px}.bubble+form{margin-top:20px}.fine:empty{display:none}
button:disabled{opacity:.6;cursor:default}

function api(u,o){return fetch(u,o).then(function(r){return r.json().then(function(j){j.ok=r.ok;return j})})}
function post(u,b){return api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})}
var keys=[];try{keys=JSON.parse(localStorage.getItem('bk')||'[]')}catch(e){}
function saveKeys(){try{localStorage.setItem('bk',JSON.stringify(keys))}catch(e){}}
function card(stamp){var c=h('section','card');c.append(h('span','stamp',stamp));V.append(c);return c}
function head(c,title,lede,item){var t=h('h1');if(item){t.append(title);t.append(h('span','item',item))}else t.textContent=title;c.append(t);if(lede)c.append(h('p','lede',lede))}
function bub(c,text,mine){c.append(h('p','bubble'+(mine?' me':''),text))}
function btn(text,type,ghost){var b=h('button','go'+(ghost?' ghost':''),text);b.type=type||'button';return b}
function field(f,id,label,ph,area){var l=h('label',null,label);l.htmlFor=id;var i=h(area?'textarea':'input');i.id=id;i.placeholder=ph;i.required=true;i.autocomplete='off';f.append(l,i);return i}
function finder(code){api('/api/sticker/'+code).then(function(d){V.innerHTML='';
 if(d.state==='unknown'){var c=card('Unknown');head(c,'We don\u2019t know this one','This code isn\u2019t in our system. Check the sticker and try again.');return}
 if(d.state==='unclaimed')return claim(code);
 found(code,d,'')})}
function claim(code){
 var c=card('Unclaimed');head(c,'Hey, is this one yours?','Nobody\u2019s linked to this sticker yet. Tell us what it\u2019s stuck on and how to reach you, and it\u2019s yours.');
 var f=h('form'),a=field(f,'a','What\u2019s it stuck on?','Blue Chem notebook'),b=field(f,'b','Where can we reach you?','you@college.edu');
 var s=btn('Activate sticker','submit'),e=h('p','fine','Finders see the item, never your details.');f.append(s,e);c.append(f);
 f.onsubmit=function(ev){ev.preventDefault();s.disabled=true;
  post('/api/sticker/'+code+'/claim',{item:a.value,contact:b.value}).then(function(r){
   if(!r.ok){s.disabled=false;e.textContent=r.error||'Something went wrong, try again.';return}
   keys.push(r.key);saveKeys();try{Notification.requestPermission()}catch(x){}
   var name=a.value.trim();c.innerHTML='';var ok=h('div','okb'),m=h('div','bmg'),im=h('img');im.src=LOGO;im.alt='Boomerang';m.append(im);ok.append(m);
   head(ok,'Sticker\u2019s live.','Your '+name+' is protected. If anyone scans this sticker, you\u2019ll hear about it.');
   var back=btn('Back to my stickers','button',true);back.onclick=function(){location.href='/'};ok.append(back);c.append(ok)})}}
function found(code,d,note){
 var c=card('Found it');head(c,'You found a ','The owner stays anonymous. Send a message and they get pinged right away.',d.item);
 (d.msgs||[]).forEach(function(x){bub(c,x.text,x.from==='finder')});
 var f=h('form'),t=field(f,'c','Tell them where it is','I found this near the canteen',true);
 var s=btn('Send to owner','submit'),e=h('p','fine',note);f.append(s,e);c.append(f);
 f.onsubmit=function(ev){ev.preventDefault();s.disabled=true;
  post('/api/sticker/'+code+'/message',{text:t.value}).then(function(r){
   if(!r.ok){s.disabled=false;e.textContent=r.error||'Something went wrong, try again.';return}
   api('/api/sticker/'+code).then(function(n){V.innerHTML='';found(code,n,'Sent! The owner just got a ping. Thanks for being the good one.')})})}}
var seen={};
function owner(first){api('/api/inbox?keys='+keys.join(',')).then(function(d){V.innerHTML='';
 if(!d.items||!d.items.length){var c=card('Your stickers');head(c,'No stickers yet','Scan a new Boomerang sticker with your phone camera to claim it.');
  var sc=h('div','scan');for(var i=0;i<4;i++)sc.append(h('i'));sc.append(document.createTextNode('Point your camera at the QR on the sticker'));c.append(sc);return}
 d.items.forEach(function(s){
  var n=s.msgs.filter(function(x){return x.from==='finder'}).length;
  var c=card(n?n+(n>1?' messages':' message')+' from finders':'All quiet');
  if(n)head(c,'Someone found your ','They don\u2019t know who you are. Here\u2019s what they said.',s.item);else head(c,s.item,'Nobody has found this one yet. Code '+s.code+'.');
  s.msgs.forEach(function(x){bub(c,x.text,x.from==='owner')});
  if(!first&&seen[s.code]!=null&&n>seen[s.code]){try{new Notification('Boomerang',{body:'Someone found your '+s.item})}catch(x){}}
  seen[s.code]=n;
  if(n){var f=h('form'),r=field(f,'r'+s.code,'Reply to the finder','Thanks! Can you drop it at the library desk?'),b=btn('Reply','submit');f.append(b);c.append(f);
   f.onsubmit=function(ev){ev.preventDefault();b.disabled=true;post('/api/sticker/'+s.code+'/reply',{key:s.key,text:r.value}).then(function(){owner(true)})}}})})}
var m=location.pathname.match(/^\/s\/(BMR-[A-Z0-9]{5})$/);
if(m)finder(m[1]);else{owner(true);setInterval(function(){var a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))return;owner(false)},6000)}
</script></body></html>
