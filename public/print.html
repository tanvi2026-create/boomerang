<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Print stickers</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>body{font:16px Arial;margin:20px}input,button{padding:10px;font:inherit;margin:4px}#g{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.s{width:200px;border:2px dashed #14121f;border-radius:14px;padding:12px;text-align:center}.s div.q{display:flex;justify-content:center}.s b{display:block;margin-top:6px}.s small{display:block;font:700 13px monospace;margin-top:4px}@media print{.ui{display:none}}</style></head>
<body><div class="ui"><h2>Boomerang: print new stickers</h2><input id="p" type="password" placeholder="Admin password"><input id="n" type="number" value="12" min="1" max="100"><button id="go">Create codes</button> <button onclick="print()">Print</button><p id="e"></p></div><div id="g"></div>
<script>document.getElementById('go').onclick=async()=>{const r=await fetch('/api/issue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass:p.value,n:+n.value})}),j=await r.json();
if(!r.ok){e.textContent=j.error;return}g.innerHTML='';j.codes.forEach(c=>{const d=document.createElement('div');d.className='s';const q=document.createElement('div');q.className='q';d.append(q);
new QRCode(q,{text:location.origin+'/s/'+c,width:130,height:130});const b=document.createElement('b');b.textContent='Found me? Scan to message my owner';const s=document.createElement('small');s.textContent=c;d.append(b,s);g.append(d)})}</script></body></html>
